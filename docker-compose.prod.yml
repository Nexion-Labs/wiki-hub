version: '3.9'

# Production Docker Compose - Single Unified Image
# Frontend and Backend built into one container

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: wiki-database-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wikidb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - wiki-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wikidb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified Application (Frontend + Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: wiki-app:latest
    container_name: wiki-app-prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@database:5432/${DB_NAME:-wikidb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - wiki-network-prod
    volumes:
      # Logs directory (optional)
      - app_logs_prod:/app/logs
    healthcheck:
      test: ["CMD", "bun", "run", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  wiki-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  app_logs_prod:
    driver: local
